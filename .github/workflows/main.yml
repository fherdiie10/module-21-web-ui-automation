name: API and UI Automation Test

on:
  push:
  pull_request:
    types: [closed]

permissions:
  contents: read


jobs:
  automation-test:

    if: ${{ github.event_name == 'push' || github.event.pull_request.merged == true }}

    runs-on: ubuntu-latest


    steps:

      - name: Checkout Repository
        uses: actions/checkout@v6


      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'


      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6


      - name: Give Permission to Gradle
        run: chmod +x gradlew


      - name: Run Web UI Automation Test
        run: xvfb-run --auto-servernum ./gradlew :app:webTest --no-daemon


      - name: Run API Automation Test
        run: ./gradlew :app:apiTest --no-daemon


      - name: Upload Cucumber Report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: cucumber-report
          path: |
            app/build/reports/web-cucumber-report.html
            app/build/reports/web-cucumber-report.json
            app/build/reports/api-cucumber-report.html
            app/build/reports/api-cucumber-report.json
          if-no-files-found: warn